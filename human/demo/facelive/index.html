<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>人脸识别</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="manifest" href="../manifest.webmanifest">
    <link rel="shortcut icon" href="../../favicon.ico" type="image/x-icon">
    <style>

        html, body {
        	touch-action: pan-x pan-y;
        	-webkit-touch-callout: none;
        	-webkit-user-select: none;
        	user-select: none;
        }

        body {
            margin: 0;
            display: flex;
            place-items: center;
            min-width: 320px;
            min-height: 100vh;
            justify-content: center;
            background-color: #ffffff;
            color: #333;
            font-family: Inter, system-ui, Avenir, Helvetica, Arial, sans-serif;
        }

        .page {
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
            padding: 3.125rem 1.25rem;
            text-align: center;
            box-sizing: border-box;
        }
		
		.stage-page {
		    width: 100%;
		    display: none;
		}
		
		.stage-page.active {
		    display: block;
		}

        /* 初始页面样式 */
        #page-init {
            background: #fff;
			width: 100%;
			height: 100%;
        }

        .init-content {
            text-align: center;
			width: 100%;
			height: 100%;
        }

        .init-title {
            font-size: 1.125rem;
            font-weight: 600;
            color: #333;
            line-height: 1.3;
        }

        .avatar-container {
            width: 240px;
            height: 240px;
            margin: 1.25rem auto 1.25rem;
            position: relative;
        }

        .avatar-circle {
            width: 100%;
            height: 100%;
            border: 5px solid #02B17B;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .init-camera {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar-countdown {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 80px;
            font-weight: 300;
            color: #02B17B;
            z-index: 10;
            display: none;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .avatar-countdown.active {
            display: block;
            animation: countdownPulse 1s ease-in-out infinite;
        }

        @keyframes countdownPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.1); }
        }

        .init-camera.countdown-active {
            opacity: 0.5;
        }

        .countdown-hint {
            background: #D9F7ED;
            padding: 16px;
            border-radius: 12px;
            margin-top: 16px;
            font-size: 14px;
            color: #333;
            line-height: 1.4;
            display: none;
        }

        .countdown-hint.active {
            display: block;
        }

        .attention-box {
            background: #D9F7ED;
            padding: 10px 0;
            border-radius: 12px;
			margin-top: 0.625rem;
        }

        .attention-text {
            font-size: 1rem;
            color: #333;
            font-weight: 500;
        }

        .tips-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 1.25rem;
        }

        .tip-item {
            text-align: center;
        }

        .tip-icon {
            width: 60px;
            height: 60px;
            margin: 0 auto 8px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .tip-icon.success {
            background: #e8f5e8;
        }

        .tip-icon.error {
            background: #ffe8e8;
        }

        .tip-icon svg {
            width: 24px;
            height: 24px;
        }

        .tip-text {
            font-size: 12px;
            color: #666;
            line-height: 1.3;
        }

        .start-btn {
			margin-top: 1.875rem;
            width: 100%;
            height: 56px;
            background: #02B17B;
            border: none;
            border-radius: 28px;
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .start-btn:active {
            transform: scale(0.98);
            background: #45a049;
        }


        .detection-container {
            text-align: center;
            padding: 20px;
        }

        #canvas {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .step-indicator {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin: 20px 0;
        }

        .step-circle {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
        }

        .step-circle.active {
            background: #02B17B;
            color: white;
        }

        .step-circle.inactive {
            background: #E0E0E0;
            color: #999;
        }

        .step-arrow {
            color: #999;
            font-size: 16px;
        }

        .detection-hint {
            background: #D9F7ED;
            padding: 16px;
            border-radius: 12px;
            margin: 20px 0;
            font-size: 16px;
            color: #333;
            line-height: 1.4;
        }

        .status-text {
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }

        .result-icon {
            width: 100px;
            height: 100px;
            margin: 0 auto 30px;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
			position: absolute;
        }

        .result-icon.success {
            background: linear-gradient(135deg, #4caf50 0%, #2e7d32 100%);
            box-shadow: 0 10px 40px rgba(76, 175, 80, 0.4);
        }

        .result-icon.failed {
            background: linear-gradient(135deg, #f44336 0%, #c62828 100%);
            box-shadow: 0 10px 40px rgba(244, 67, 54, 0.4);
        }

        .result-icon svg {
            width: 50px;
            height: 50px;
            fill: #fff;
        }

        .result-title {
            font-size: 26px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .retry-btn {
            width: 80%;
            max-width: 320px;
            height: 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 25px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 2px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .retry-btn:active {
            transform: scale(0.98);
        }

        /* 动画 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        .scale-in {
            animation: scaleIn 0.4s ease forwards;
        }
    </style>
</head>
<body>
    <!-- 初始页面 -->
    <div class="page active">
        <div class="init-content">
            <h1 class="init-title">Face the screen Follow the prompts</h1>
            <div class="avatar-container">
                <div class="avatar-circle">
                    <video id="init-camera" class="init-camera" autoplay playsinline muted></video>
                    <div id="avatar-countdown" class="avatar-countdown">5s</div>
					<canvas id="canvas"></canvas>
					<div id="result-icon" class="result-icon success">
					    <svg id="icon-success" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
					    <svg id="icon-failed" viewBox="0 0 24 24" style="display:none"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
					</div>
                </div>
            </div>
			<div id="page-init" class="stage-page active">
				<div class="attention-box" id="attention-box">
				    <div class="attention-text">Please pay attention when testing</div>
				</div>
				<div class="countdown-hint" id="countdown-hint">
				    Please make sure the face is within the circle, and the detection will start after the countdown is over
				</div>
				<div class="tips-grid" id="tips-grid">
				    <div class="tip-item">
				        <div class="tip-icon success">
				            <svg viewBox="0 0 100 100" fill="#4caf50"><circle cx="50" cy="50" r="45" fill="#e8f5e8"/><path d="M30 40 Q40 30 50 40 Q60 30 70 40 V60 Q60 70 50 60 Q40 70 30 60 Z" fill="#4caf50"/><path d="M25 35 L35 45 M75 35 L65 45" stroke="#4caf50" stroke-width="3"/><path d="M40 25 L60 25 M40 75 L60 75" stroke="#4caf50" stroke-width="3"/></svg>
				        </div>
				        <div class="tip-text">Need bright light</div>
				    </div>
				    <div class="tip-item">
				        <div class="tip-icon error">
				            <svg viewBox="0 0 100 100" fill="#f44336"><circle cx="50" cy="50" r="45" fill="#ffe8e8"/><path d="M30 40 Q40 30 50 40 Q60 30 70 40 V60 Q60 70 50 60 Q40 70 30 60 Z" fill="#f44336"/><path d="M35 35 L65 35" stroke="#f44336" stroke-width="3"/><path d="M25 45 L75 45" stroke="#f44336" stroke-width="3"/><path d="M40 25 L60 25 M40 75 L60 75" stroke="#f44336" stroke-width="3"/></svg>
				        </div>
				        <div class="tip-text">Do not cover your face</div>
				    </div>
				    <div class="tip-item">
				        <div class="tip-icon error">
				            <svg viewBox="0 0 100 100" fill="#f44336"><circle cx="50" cy="50" r="45" fill="#ffe8e8"/><path d="M30 40 Q40 30 50 40 Q60 30 70 40 V60 Q60 70 50 60 Q40 70 30 60 Z" fill="#f44336"/><path d="M30 25 Q50 20 70 25" stroke="#f44336" stroke-width="3" fill="none"/><path d="M40 75 L60 75" stroke="#f44336" stroke-width="3"/></svg>
				        </div>
				        <div class="tip-text">No hat</div>
				    </div>
				    <div class="tip-item">
				        <div class="tip-icon error">
				            <svg viewBox="0 0 100 100" fill="#f44336"><circle cx="50" cy="50" r="45" fill="#ffe8e8"/><path d="M30 40 Q40 30 50 40 Q60 30 70 40 V60 Q60 70 50 60 Q40 70 30 60 Z" fill="#f44336"/><path d="M25 35 L35 45 M75 35 L65 45" stroke="#f44336" stroke-width="3"/><path d="M40 25 L60 25 M40 75 L60 75" stroke="#f44336" stroke-width="3"/><path d="M15 50 L25 50 M75 50 L85 50" stroke="#f44336" stroke-width="3"/></svg>
				        </div>
				        <div class="tip-text">Do not move too fast</div>
				    </div>
				</div>
				<button id="btn-start" class="start-btn">立即开始</button>
			</div>
			
			<!-- 检测页面 -->
			<div id="page-detection" class="stage-page">
			    <div class="detection-container">
			        
			        <div class="step-indicator">
			            <div id="step-1" class="step-circle active">1</div>
			            <span class="step-arrow">»</span>
			            <div id="step-2" class="step-circle inactive">2</div>
			            <span class="step-arrow">»</span>
			            <div id="step-3" class="step-circle inactive">3</div>
			        </div>
			        <div class="detection-hint" id="detection-hint">
			            Please open your mouth
			        </div>
			        <div class="status-text" id="status-text"></div>
			    </div>
			</div>
			
			<!-- 结果页面 -->
			<div id="page-result" class="stage-page">
				
				<h2 id="result-title" class="result-title">验证通过</h2>
				<button id="btn-retry" class="start-btn">重新验证</button>
			</div>
            
        </div>
    </div>

    

    <script type="module">
        import * as H from '../../dist/human.esm.js';

        const PAGES = {
            INIT: 'page-init',
            DETECTION: 'page-detection',
            RESULT: 'page-result'
        };

        const STEP = {
            MOUTH_OPEN: 'MOUTH_OPEN',
            HEAD_LEFT: 'HEAD_LEFT',
            HEAD_RIGHT: 'HEAD_RIGHT',
            DONE: 'DONE'
        };

        const steps = [STEP.MOUTH_OPEN, STEP.HEAD_LEFT, STEP.HEAD_RIGHT];

        const humanConfig = {
            modelBasePath: '../../models',
            filter: { enabled: true, equalization: true, flip: false },
            face: {
                enabled: true,
                detector: { rotation: false },
                mesh: { enabled: true },
                iris: { enabled: true },
                attention: { enabled: false },
                emotion: { enabled: false },
                description: { enabled: false },
                antispoof: { enabled: false },
                liveness: { enabled: false }
            },
            body: { enabled: false },
            hand: { enabled: false },
            gesture: { enabled: false },
            object: { enabled: false },
            segmentation: { enabled: false }
        };

        const human = new H.Human(humanConfig);

        const thresholds = {
            mouthOpenRatio: 0.075,
            headYawRadians: 0.25,
            stableFrames: 8,
            faceScore: 0.65
        };

        const state = {
            currentPage: PAGES.INIT,
            stepIndex: 0,
            stableCount: 0,
            leftYawSign: 0,
            lastCompletedAt: 0
        };

        const canvas = document.getElementById('canvas');
        const detectionHint = document.getElementById('detection-hint');
        const statusText = document.getElementById('status-text');
        const step1 = document.getElementById('step-1');
        const step2 = document.getElementById('step-2');
        const step3 = document.getElementById('step-3');

        const nowMs = () => (typeof performance !== 'undefined' ? performance.now() : Date.now());

        const dist2d = (a, b) => {
            const dx = (a?.[0] ?? 0) - (b?.[0] ?? 0);
            const dy = (a?.[1] ?? 0) - (b?.[1] ?? 0);
            return Math.hypot(dx, dy);
        };

        const getPrimaryFace = (res) => {
            const faces = res?.face || res?.faces || [];
            if (!Array.isArray(faces) || faces.length === 0) return null;
            const scored = faces
                .map((f) => ({ f, score: (typeof f.score === 'number' ? f.score : (typeof f.confidence === 'number' ? f.confidence : 0)) }))
                .sort((a, b) => b.score - a.score);
            return scored[0]?.f ?? null;
        };

        const computeMouthOpenRatio = (face) => {
            const mesh = face?.mesh;
            if (!Array.isArray(mesh) || mesh.length < 292) return 0;
            const upper = mesh[13];
            const lower = mesh[14];
            const left = mesh[61];
            const right = mesh[291];
            const gap = dist2d(upper, lower);
            const width = dist2d(left, right);
            if (!width) return 0;
            return gap / width;
        };

        const computeYaw = (face) => {
            const yaw = face?.rotation?.angle?.yaw;
            return typeof yaw === 'number' ? yaw : 0;
        };

        const currentStep = () => (state.stepIndex >= steps.length ? STEP.DONE : steps[state.stepIndex]);

        const stepText = () => {
            const s = currentStep();
            if (s === STEP.MOUTH_OPEN) return 'Please open your mouth';
            if (s === STEP.HEAD_LEFT) return 'Please turn your head slowly to the left';
            if (s === STEP.HEAD_RIGHT) return 'Please turn your head slowly to the right';
            return 'Completed';
        };

        const showPage = (pageId) => {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            state.currentPage = pageId;
        };

        const updateStepIndicator = () => {
            step1.className = 'step-circle ' + (state.stepIndex >= 0 ? 'active' : 'inactive');
            step2.className = 'step-circle ' + (state.stepIndex >= 1 ? 'active' : 'inactive');
            step3.className = 'step-circle ' + (state.stepIndex >= 2 ? 'active' : 'inactive');
        };

        const markStepPassed = () => {
            state.stepIndex += 1;
            state.stableCount = 0;
            state.lastCompletedAt = nowMs();
            updateStepIndicator();

            if (currentStep() === STEP.DONE) {
                showResult(true);
            } else {
                detectionHint.textContent = stepText();
            }
        };

        const checkStep = (face) => {
            const s = currentStep();
            if (s === STEP.DONE) return;

            if (!face) {
                state.stableCount = 0;
                statusText.textContent = 'No face detected, please align with the camera';
                return;
            }

            const score = typeof face.score === 'number' ? face.score : (typeof face.confidence === 'number' ? face.confidence : 0);
            if (score && score < thresholds.faceScore) {
                state.stableCount = 0;
                statusText.textContent = 'Face confidence is low, please move closer and face the camera';
                return;
            }

            const mouthRatio = computeMouthOpenRatio(face);
            const yaw = computeYaw(face);
            const yawAbs = Math.abs(yaw);
            const cooldown = nowMs() - state.lastCompletedAt < 450;

            let ok = false;
            if (!cooldown) {
                if (s === STEP.MOUTH_OPEN) {
                    ok = mouthRatio >= thresholds.mouthOpenRatio;
                } else if (s === STEP.HEAD_LEFT) {
                    ok = yawAbs >= thresholds.headYawRadians;
                    if (ok) state.leftYawSign = Math.sign(yaw) || 1;
                } else if (s === STEP.HEAD_RIGHT) {
                    const sign = Math.sign(yaw) || 1;
                    ok = yawAbs >= thresholds.headYawRadians && (state.leftYawSign ? sign === -state.leftYawSign : true);
                }
            }

            if (ok) state.stableCount += 1;
            else state.stableCount = 0;

            const progress = Math.min(1, state.stableCount / thresholds.stableFrames);
            const progressPct = Math.round(progress * 100);
            statusText.textContent = `Progress: ${progressPct}% | Face: ${Math.round((score || 0) * 100)}% | Mouth: ${mouthRatio.toFixed(2)} | Yaw: ${yaw.toFixed(2)}`;

            if (state.stableCount >= thresholds.stableFrames) {
                markStepPassed();
            }
        };

        const showResult = (passed) => {
            human.webcam.pause();
            const resultIcon = document.getElementById('result-icon');
            const resultTitle = document.getElementById('result-title');
            const iconSuccess = document.getElementById('icon-success');
            const iconFailed = document.getElementById('icon-failed');
			resultIcon.style.display = 'block';
            if (passed) {
                resultIcon.classList.remove('failed');
                resultIcon.classList.add('success');
                iconSuccess.style.display = 'block';
                iconFailed.style.display = 'none';
                resultTitle.textContent = 'Verification passed';
            } else {
                resultIcon.classList.remove('success');
                resultIcon.classList.add('failed');
                iconSuccess.style.display = 'none';
                iconFailed.style.display = 'block';
                resultTitle.textContent = 'Verification failed';
            }

            showPage(PAGES.RESULT);
        };

        const startCountdown = () => {
            const countdownEl = document.getElementById('avatar-countdown');
            const cameraEl = document.getElementById('init-camera');
            const btnStart = document.getElementById('btn-start');
            const attentionBox = document.getElementById('attention-box');
            const countdownHint = document.getElementById('countdown-hint');
            const tipsGrid = document.getElementById('tips-grid');

            btnStart.style.display = 'none';
            attentionBox.style.display = 'none';
            tipsGrid.style.display = 'none';
            countdownHint.classList.add('active');
            countdownEl.classList.add('active');
            cameraEl.classList.add('countdown-active');

            let count = 5;
            countdownEl.textContent = `${count}s`;

            const interval = setInterval(() => {
                count--;
                if (count > 0) {
                    countdownEl.textContent = `${count}s`;
                } else {
                    clearInterval(interval);
                    countdownEl.classList.remove('active');
                    cameraEl.classList.remove('countdown-active');
                    countdownHint.classList.remove('active');
                    startDetection();
                }
            }, 1000);
        };

        async function startDetection() {
            showPage(PAGES.DETECTION);
            state.stepIndex = 0;
            state.stableCount = 0;
            state.leftYawSign = 0;
            state.lastCompletedAt = 0;
            updateStepIndicator();
            detectionHint.textContent = stepText();

            
            canvas.width = human.webcam.width;
            canvas.height = human.webcam.height;

            drawLoop();
        };

        async function drawLoop() {
            if (state.currentPage !== PAGES.DETECTION) return;

            const interpolated = human.next();
            human.draw.canvas(human.webcam.element, canvas);
            await human.draw.all(canvas, interpolated);

            if (currentStep() !== STEP.DONE) {
                const face = getPrimaryFace(interpolated);
                checkStep(face);
            }

            setTimeout(drawLoop, 30);
        }

        const resetToInit = () => {
            state.stepIndex = 0;
            state.stableCount = 0;
            state.leftYawSign = 0;
            state.lastCompletedAt = 0;
            statusText.textContent = '';
            updateStepIndicator();

            const btnStart = document.getElementById('btn-start');
            const attentionBox = document.getElementById('attention-box');
            const countdownHint = document.getElementById('countdown-hint');
            const tipsGrid = document.getElementById('tips-grid');
            
            btnStart.style.display = 'block';
            attentionBox.style.display = 'block';
            tipsGrid.style.display = 'grid';
            countdownHint.classList.remove('active');

            showPage(PAGES.INIT);
        };

        async function initCamera() {
            const video = document.getElementById('init-camera');
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    video.play();
                };
            } catch (error) {
                console.error('Error accessing camera:', error);
            }
        }

        function stopInitCamera() {
            const video = document.getElementById('init-camera');
            if (video.srcObject) {
                const stream = video.srcObject;
                const tracks = stream.getTracks();
                tracks.forEach(track => track.stop());
                video.srcObject = null;
            }
        }
		
		async function initHuman(){
			await human.webcam.start({ crop: true });
			human.video(human.webcam.element);
		}

        document.getElementById('btn-start').addEventListener('click', () => {
            startCountdown();
        });

        document.getElementById('btn-retry').addEventListener('click', () => {
            resetToInit();
            initCamera();
        });

        canvas.addEventListener('click', async () => {
            if (human.webcam.paused) await human.webcam.play();
            else human.webcam.pause();
        });

        window.onload = () => {
            initCamera();
			initHuman();
        };
    </script>
</body>
</html>
